<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riftbound Score Track (Internet Sync)</title>
  <!-- Librería gratuita para conexión P2P por Internet -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ESTADO DE CONEXIÓN */
    #status-bar {
      position: absolute;
      top: 5px;
      left: 5px;
      font-family: sans-serif;
      font-size: 12px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 10;
    }

    /* OVERLAY EN OBS */
    #overlay-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #38bdf8;
      border-radius: 50px;
      padding: 10px 20px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .side { display: flex; gap: 15px; }

    .node {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #94a3b8;
      font-weight: bold;
    }

    .node.center-goal {
      width: 65px;
      height: 65px;
      background: #eab308;
      color: #0f172a;
      border-radius: 50%;
      font-size: 32px;
      box-shadow: 0 0 15px #eab308;
      margin: 0 15px;
    }

    /* CONFIGURACIÓN GENERAL DE LAS FICHAS CON IMAGEN */
.p-token {
  position: absolute;
  width: 50px;              /* Tamaño de la ficha */
  height: 50px;
  border-radius: 50%;
  z-index: 3;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  justify-content: center;
  align-items: center;
  
  /* Ajustes para mostrar la imagen correctamente */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 2px solid #ffffff; /* Borde blanco para resaltar sobre el fondo */
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
}

/* LOGO Y ESTILO PARA EL JUGADOR 1 */
#token-p1 {
  background-image: url('faccion1.png'); /* Ruta a la imagen del J1 */
  border-color: #ef4444;                 /* Borde con el color característico */
  box-shadow: 0 0 14px #ef4444;
}

/* LOGO Y ESTILO PARA EL JUGADOR 2 */
#token-p2 {
  background-image: url('faccion1.png'); /* Ruta a la imagen del J2 */
  border-color: #3b82f6;                 /* Borde con el color característico */
  box-shadow: 0 0 14px #3b82f6;
}

    /* CONTROL EN EL TELÉFONO */
    #controller-container {
      display: none;
      height: 100vh;
      background: #0f172a;
      color: white;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .p-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-group { display: flex; gap: 20px; }

    button {
      width: 80px;
      height: 80px;
      font-size: 36px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
    }

    .btn-p1 { background: #ef4444; }
    .btn-p2 { background: #3b82f6; }
    .score-disp { font-size: 48px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="status-bar">Conectando...</div>

  <!-- OVERLAY (OBS) -->
  <div id="overlay-container">
    <div class="track" id="track">
      <div class="side" id="p1-nodes">
        <div class="node" data-val="0">0</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="7">7</div>
      </div>

      <div class="node center-goal" id="goal-node" data-val="8">8</div>

      <div class="side" id="p2-nodes">
        <div class="node" data-val="7">7</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="0">0</div>
      </div>

      <div id="token-p1" class="p-token"></div>
      <div id="token-p2" class="p-token"></div>
    </div>
  </div>

  <!-- CONTROLADOR (TELÉFONO) -->
  <div id="controller-container">
    <div class="p-control">
      <h2 style="color: #ef4444; margin:0;">JUGADOR 1</h2>
      <div class="score-disp" id="p1-score-txt">0</div>
      <div class="btn-group">
        <button class="btn-p1" onclick="changeScore(1, -1)">-</button>
        <button class="btn-p1" onclick="changeScore(1, 1)">+</button>
      </div>
    </div>

    <hr style="width: 100%; border-color: #334155;">

    <div class="p-control">
      <h2 style="color: #3b82f6; margin:0;">JUGADOR 2</h2>
      <div class="score-disp" id="p2-score-txt">0</div>
      <div class="btn-group">
        <button class="btn-p2" onclick="changeScore(2, -1)">-</button>
        <button class="btn-p2" onclick="changeScore(2, 1)">+</button>
      </div>
    </div>
  </div>

  <script>
    let state = { p1: 0, p2: 0 };
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'riftbound-123'; // ID de sala por defecto
    const isControl = urlParams.has('control');
    const statusBar = document.getElementById('status-bar');

    if (isControl) {
      document.getElementById('overlay-container').style.display = 'none';
      document.getElementById('controller-container').style.display = 'flex';
    }

    // Configuración de Conexión por Internet usando PeerJS
    let peer, conn;

    if (isControl) {
      // El teléfono se conecta al PC
      peer = new Peer();
      peer.on('open', () => {
        statusBar.innerText = "Conectando con OBS...";
        conn = peer.connect('obs-' + room);
        
        conn.on('open', () => {
          statusBar.innerText = "Conectado a OBS por Internet";
          statusBar.style.color = "#4ade80";
        });
      });
    } else {
      // OBS escucha las conexiones del teléfono
      peer = new Peer('obs-' + room);
      peer.on('open', (id) => {
        statusBar.innerText = "OBS listo. Esperando al celular...";
      });

      peer.on('connection', (c) => {
        conn = c;
        statusBar.innerText = "Celular conectado";
        statusBar.style.color = "#4ade80";
        
        conn.on('data', (data) => {
          state = data;
          updateUI();
        });
      });
    }

    function changeScore(player, delta) {
      if (player === 1) {
        state.p1 = Math.min(8, Math.max(0, state.p1 + delta));
      } else {
        state.p2 = Math.min(8, Math.max(0, state.p2 + delta));
      }

      if (conn && conn.open) {
        conn.send(state);
      }
      updateUI();
    }

    function updateUI() {
      if (isControl) {
        document.getElementById('p1-score-txt').innerText = state.p1;
        document.getElementById('p2-score-txt').innerText = state.p2;
        return;
      }

      moveToken('token-p1', 'p1-nodes', state.p1);
      moveToken('token-p2', 'p2-nodes', state.p2);
    }

    function moveToken(tokenId, containerId, value) {
      const token = document.getElementById(tokenId);
      let targetNode;

      if (value === 8) {
        targetNode = document.getElementById('goal-node');
      } else {
        const container = document.getElementById(containerId);
        targetNode = container.querySelector(`[data-val="${value}"]`);
      }

      if (targetNode) {
        const trackRect = document.getElementById('track').getBoundingClientRect();
        const nodeRect = targetNode.getBoundingClientRect();

        const leftPos = nodeRect.left - trackRect.left + (nodeRect.width / 2) - 23;
        const topPos = nodeRect.top - trackRect.top + (nodeRect.height / 2) - 23;

        token.style.transform = `translate(${leftPos}px, ${topPos}px)`;
      }
    }

    window.onload = () => { setTimeout(updateUI, 200); };
    window.onresize = updateUI;
  </script>
</body>
</html>
