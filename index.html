<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Riftbound Score Track</title>

  <!-- Meta tags para modo PWA / Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- Librería PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* OVERLAY EN PLANTA/CONTENEDOR GLOBAL */
    #overlay-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    /* === LAYOUT HORIZONTAL (TAMAÑO ORIGINAL COMPACTO) === */
    #overlay-container.layout-horizontal {
      justify-content: center;
      align-items: flex-start;
    }

    #overlay-container.layout-horizontal .track {
      flex-direction: row;
      margin-top: 0;
      padding: 0 30px;
      height: 50px;
      width: auto;

      background: linear-gradient(
        90deg, 
        rgba(0, 0, 0, 0) 0%, 
        rgba(0, 0, 0, 0.9) 30%, 
        rgba(0, 0, 0, 0.9) 70%, 
        rgba(0, 0, 0, 0) 100%
      );

      border-bottom: 3px solid transparent;
      border-image: linear-gradient(
        90deg, 
        rgba(206, 60, 53, 0) 0%, 
        rgba(206, 60, 53, 0.9) 30%, 
        rgba(206, 60, 53, 0.9) 70%, 
        rgba(206, 60, 53, 0) 100%
      ) 1;

      animation: scaleXExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-container.layout-horizontal .side {
      flex-direction: row;
      gap: 10px;
    }

    #overlay-container.layout-horizontal .node {
      width: 34px;
      height: 34px;
      border-width: 2px;
      font-size: 20px;
    }

    #overlay-container.layout-horizontal .node.center-goal {
      width: 46px;
      height: 46px;
      border-width: 4px;
      font-size: 28px;
      margin: 0 15px;
    }

    @keyframes scaleXExpand {
      0% { opacity: 0; transform: scaleX(0); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    /* === LAYOUT VERTICAL (MÁS GRANDE Y PROPORCIONAL) === */
    #overlay-container.layout-vertical {
      justify-content: flex-end;
      align-items: center;
    }

    #overlay-container.layout-vertical .track {
      flex-direction: column;
      margin-right: 0;
      padding: 45px 0;
      width: 75px;
      height: auto;

      background: linear-gradient(
        180deg, 
        rgba(0, 0, 0, 0) 0%, 
        rgba(0, 0, 0, 0.9) 30%, 
        rgba(0, 0, 0, 0.9) 70%, 
        rgba(0, 0, 0, 0) 100%
      );

      border-left: 4px solid transparent;
      border-image: linear-gradient(
        180deg, 
        rgba(206, 60, 53, 0) 0%, 
        rgba(206, 60, 53, 0.9) 30%, 
        rgba(206, 60, 53, 0.9) 70%, 
        rgba(206, 60, 53, 0) 100%
      ) 1;

      animation: scaleYExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #overlay-container.layout-vertical .side {
      flex-direction: column;
      gap: 15px;
    }

    #overlay-container.layout-vertical .node {
      width: 52px;
      height: 52px;
      border-width: 3px;
      font-size: 30px;
    }

    #overlay-container.layout-vertical .node.center-goal {
      width: 68px;
      height: 68px;
      border-width: 5px;
      font-size: 40px;
      margin: 22px 0;
    }

    @keyframes scaleYExpand {
      0% { opacity: 0; transform: scaleY(0); }
      100% { opacity: 1; transform: scaleY(1); }
    }

    /* ESTILOS COMUNES DE LA PISTA Y NODOS */
    .track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .track.animate-in.layout-horiz-anim {
      animation: none;
      animation: scaleXExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .track.animate-in.layout-vert-anim {
      animation: none;
      animation: scaleYExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .side { 
      display: flex; 
    }

    /* NODOS / NÚMEROS NORMALES (0 AL 7) */
    .node {
      border-radius: 50%;
      border-style: solid;
      border-color: #ce3c35;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    /* NÚMERO 8 CENTRAL - DESCONECTADO */
    .node.center-goal {
      border-radius: 50%;
      border-style: solid;
      border-color: #ce3c35;
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      transition: border-color 0.4s ease, color 0.4s ease;
      box-sizing: border-box;
    }

    /* NÚMERO 8 CENTRAL - CONECTADO */
    .node.center-goal.connected {
      border-color: #ffffff;
      color: #ce3c35;
    }

    /* SI LA FICHA ESTÁ ENCIMA DEL NODO: DESAPARECE SOLO EL BORDE */
    .node.occupied {
      border-color: transparent !important;
    }

    /* FICHAS (BADGES) */
    .p-token {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 50%;
      border: none !important;
      z-index: 10;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      box-sizing: border-box;
      opacity: 0;

      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, width 0.3s, height 0.3s;
    }

    .p-token.visible {
      opacity: 1;
    }

    #token-p1 {
      background-image: url('faccion1.png');
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.9);
    }

    #token-p2 {
      background-image: url('faccion1.png');
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.9);
    }

    /* VISTA CONTROLADOR */
    #controller-container {
      display: none;
      height: 100vh;
      background: #0f172a;
      color: white;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .btn-fs {
      position: absolute;
      top: 15px;
      right: 15px;
      width: auto;
      height: auto;
      padding: 8px 12px;
      font-size: 12px;
      font-family: sans-serif;
      background: #334155;
      color: #94a3b8;
      border-radius: 8px;
    }

    .p-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-group { display: flex; gap: 20px; }

    button {
      width: 80px;
      height: 80px;
      font-size: 36px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
    }

    .btn-p1 { background: #ef4444; }
    .btn-p2 { background: #3b82f6; }
    .score-disp { font-size: 48px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- OVERLAY (OBS) -->
  <div id="overlay-container">
    <div class="track" id="track">
      <div class="side" id="p1-nodes">
        <div class="node" data-val="0">0</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="7">7</div>
      </div>

      <div class="node center-goal" id="goal-node" data-val="8">8</div>

      <div class="side" id="p2-nodes">
        <div class="node" data-val="7">7</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="0">0</div>
      </div>

      <div id="token-p1" class="p-token"></div>
      <div id="token-p2" class="p-token"></div>
    </div>
  </div>

  <!-- CONTROLADOR (TELÉFONO) -->
  <div id="controller-container">
    <button class="btn-fs" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

    <div class="p-control">
      <h2 style="color: #ef4444; margin:0;">JUGADOR 1</h2>
      <div class="score-disp" id="p1-score-txt">0</div>
      <div class="btn-group">
        <button class="btn-p1" onclick="changeScore(1, -1)">-</button>
        <button class="btn-p1" onclick="changeScore(1, 1)">+</button>
      </div>
    </div>

    <hr style="width: 100%; border-color: #334155;">

    <div class="p-control">
      <h2 style="color: #3b82f6; margin:0;">JUGADOR 2</h2>
      <div class="score-disp" id="p2-score-txt">0</div>
      <div class="btn-group">
        <button class="btn-p2" onclick="changeScore(2, -1)">-</button>
        <button class="btn-p2" onclick="changeScore(2, 1)">+</button>
      </div>
    </div>
  </div>

  <script>
    let state = { p1: 0, p2: 0 };
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'riftbound-123';
    const isControl = urlParams.has('control');
    const layout = urlParams.get('layout') || 'horizontal';

    const overlayContainer = document.getElementById('overlay-container');

    if (layout === 'vertical') {
      overlayContainer.classList.add('layout-vertical');
    } else {
      overlayContainer.classList.add('layout-horizontal');
    }

    if (isControl) {
      document.getElementById('overlay-container').style.display = 'none';
      document.getElementById('controller-container').style.display = 'flex';
      initWakeLock();
    }

    let peer;
    let activeConnections = [];

    if (isControl) {
      peer = new Peer();
      peer.on('open', () => {
        connectToOverlay('obs-' + room + '-horizontal');
        connectToOverlay('obs-' + room + '-vertical');
      });

      function connectToOverlay(targetPeerId) {
        const c = peer.connect(targetPeerId);
        c.on('open', () => {
          activeConnections.push(c);
          c.send(state);
        });
        c.on('close', () => {
          activeConnections = activeConnections.filter(conn => conn !== c);
        });
      }

      window.sendToObs = function(data) {
        activeConnections.forEach(c => {
          if (c && c.open) c.send(data);
        });
      };
    } else {
      const overlayId = 'obs-' + room + '-' + layout;
      peer = new Peer(overlayId);

      peer.on('connection', (c) => {
        const goalNode = document.getElementById('goal-node');
        if (goalNode) goalNode.classList.add('connected');

        c.on('data', (data) => {
          state = data;
          updateUI();
        });

        c.on('close', () => {
          if (goalNode) goalNode.classList.remove('connected');
        });
      });
    }

    let wakeLock = null;

    async function initWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log(`Wake Lock Error: ${err.message}`);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isControl) {
        await initWakeLock();
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function changeScore(player, delta) {
      if (player === 1) {
        state.p1 = Math.min(8, Math.max(0, state.p1 + delta));
      } else {
        state.p2 = Math.min(8, Math.max(0, state.p2 + delta));
      }

      if (isControl && window.sendToObs) {
        window.sendToObs(state);
      }
      updateUI();
    }

    function updateUI() {
      if (isControl) {
        document.getElementById('p1-score-txt').innerText = state.p1;
        document.getElementById('p2-score-txt').innerText = state.p2;
        return;
      }

      moveTokenCentered('token-p1', 'p1-nodes', state.p1);
      moveTokenCentered('token-p2', 'p2-nodes', state.p2);
      updateOccupiedNodes();
    }

    function updateOccupiedNodes() {
      document.querySelectorAll('.node').forEach(node => {
        node.classList.remove('occupied');
      });

      const p1Node = (state.p1 === 8) 
        ? document.getElementById('goal-node')
        : document.querySelector(`#p1-nodes [data-val="${state.p1}"]`);
      if (p1Node) p1Node.classList.add('occupied');

      const p2Node = (state.p2 === 8)
        ? document.getElementById('goal-node')
        : document.querySelector(`#p2-nodes [data-val="${state.p2}"]`);
      if (p2Node) p2Node.classList.add('occupied');
    }

    function moveTokenCentered(tokenId, containerId, value) {
      const token = document.getElementById(tokenId);
      const track = document.getElementById('track');
      let targetNode;

      const isVert = layout === 'vertical';
      let tokenW = isVert ? 64 : 42;
      let tokenH = isVert ? 64 : 42;

      if (value === 8) {
        targetNode = document.getElementById('goal-node');
        tokenW = isVert ? 78 : 54;
        tokenH = isVert ? 78 : 54;
      } else {
        const container = document.getElementById(containerId);
        targetNode = container.querySelector(`[data-val="${value}"]`);
      }

      token.style.width = tokenW + 'px';
      token.style.height = tokenH + 'px';

      if (targetNode && track) {
        const targetX = targetNode.offsetLeft + (targetNode.offsetWidth / 2) - (tokenW / 2);
        const targetY = targetNode.offsetTop + (targetNode.offsetHeight / 2) - (tokenH / 2);

        token.style.transform = `translate3d(${targetX}px, ${targetY}px, 0)`;
      }
    }

    function setInitialTokensAtCenter() {
      const goalNode = document.getElementById('goal-node');
      const track = document.getElementById('track');
      const isVert = layout === 'vertical';
      const initRadius = isVert ? 32 : 21;

      ['token-p1', 'token-p2'].forEach((tokenId) => {
        const token = document.getElementById(tokenId);
        if (goalNode && track && token) {
          const initialX = goalNode.offsetLeft + (goalNode.offsetWidth / 2) - initRadius;
          const initialY = goalNode.offsetTop + (goalNode.offsetHeight / 2) - initRadius;

          token.style.transition = 'none';
          token.classList.remove('visible');
          token.style.transform = `translate3d(${initialX}px, ${initialY}px, 0)`;
        }
      });
    }

    function playOpeningAnimation() {
      setInitialTokensAtCenter();

      setTimeout(() => {
        ['token-p1', 'token-p2'].forEach((tokenId) => {
          const token = document.getElementById(tokenId);
          if (token) {
            token.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, width 0.3s, height 0.3s';
            token.classList.add('visible');
          }
        });

        updateUI();
      }, 400);
    }

    window.addEventListener('load', () => {
      if (!isControl) {
        setTimeout(playOpeningAnimation, 100);
      }
    });

    window.addEventListener('resize', updateUI);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !isControl) {
        const track = document.getElementById('track');

        if (track) {
          const animClass = layout === 'vertical' ? 'layout-vert-anim' : 'layout-horiz-anim';
          track.classList.remove('animate-in', 'layout-vert-anim', 'layout-horiz-anim');
          void track.offsetWidth;
          track.classList.add('animate-in', animClass);
        }

        playOpeningAnimation();
      }
    });
  </script>
</body>
</html>
