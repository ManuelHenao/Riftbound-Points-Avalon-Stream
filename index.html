<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Pista de Juego</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #status-bar {
      position: absolute;
      top: 5px;
      left: 5px;
      font-family: sans-serif;
      font-size: 12px;
      color: #CE3C35;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 100;
    }

    /* OVERLAY UBICADO ARRIBA CON MARGEN */
    #overlay-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    /* PISTA CON BORDES DE COLOR #CE3C35 Y FONDO DEGRADADO */
    .track {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 30px;
      padding: 10px 40px;
      
      background: linear-gradient(
        90deg, 
        rgba(0, 0, 0, 0) 0%, 
        rgba(0, 0, 0, 0.7) 25%, 
        rgba(0, 0, 0, 0.7) 75%, 
        rgba(0, 0, 0, 0) 100%
      );

      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: none;
      border-right: none;

      border-image: linear-gradient(
        90deg, 
        rgba(206, 60, 53, 0) 0%, 
        rgba(206, 60, 53, 0.9) 30%, 
        rgba(206, 60, 53, 0.9) 70%, 
        rgba(206, 60, 53, 0) 100%
      ) 1;

      box-sizing: border-box;

      /* ORIGEN DE TRANSFORMACIÓN EN EL CENTRO PARA LA ANIMACIÓN */
      transform-origin: center center;
      animation: expandFromCenter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* REGLA PARA REINICIAR LA ANIMACIÓN VÍA JS */
    .track.animate-in {
      animation: none;
      animation: expandFromCenter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ANIMACIÓN: EXPANSIÓN DESDE EL CENTRO HACIA LOS EXTREMOS */
    @keyframes expandFromCenter {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      100% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    .side { 
      display: flex; 
      gap: 15px; 
    }

    /* NODOS / NÚMEROS NORMALES */
    .node {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #94a3b8;
      font-weight: bold;
      box-sizing: border-box;
    }

    /* NÚMERO 8 CENTRAL (SOLO TEXTO CON SU COLOR) */
    .node.center-goal {
      width: 80px;
      height: 80px;
      background: transparent;
      color: #CE3C35;
      font-size: 42px;
      margin: 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* FICHAS (BADGES) SIN BORDE CON SOMBRA DE COLOR */
    .p-token {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0 !important;
      padding: 0 !important;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none !important;
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s, height 0.3s;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      box-sizing: border-box;
    }

    #token-p1 {
      background-image: url('faccion1.png');
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
    }

    #token-p2 {
      background-image: url('faccion1.png');
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.9);
    }

    /* ESCALADO A 100PX AL LLEGAR AL NÚMERO 8 */
    .p-token.is-goal {
      width: 100px !important;
      height: 100px !important;
    }

    /* VISTA CONTROLADOR (MÓVIL) */
    #controller-container {
      display: none;
      height: 100vh;
      background: #0f172a;
      color: white;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .p-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-group { display: flex; gap: 20px; }

    button {
      width: 80px;
      height: 80px;
      font-size: 36px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
    }

    .btn-p1 { background: #ef4444; }
    .btn-p2 { background: #3b82f6; }
    .score-disp { font-size: 48px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="status-bar">Conectando...</div>

  <!-- VISTA OVERLAY (OBS) -->
  <div id="overlay-container">
    <div class="track" id="track">
      <!-- FICHAS JUGADORES -->
      <div id="token-p1" class="p-token"></div>
      <div id="token-p2" class="p-token"></div>

      <!-- LADO JUGADOR 1 (0 A 7) -->
      <div class="side" id="p1-side">
        <div class="node" data-val="0">0</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="7">7</div>
      </div>

      <!-- CENTRO (NÚMERO 8) -->
      <div class="node center-goal" id="goal-node" data-val="8">8</div>

      <!-- LADO JUGADOR 2 (7 A 0) -->
      <div class="side" id="p2-side">
        <div class="node" data-val="7">7</div>
        <div class="node" data-val="6">6</div>
        <div class="node" data-val="5">5</div>
        <div class="node" data-val="4">4</div>
        <div class="node" data-val="3">3</div>
        <div class="node" data-val="2">2</div>
        <div class="node" data-val="1">1</div>
        <div class="node" data-val="0">0</div>
      </div>
    </div>
  </div>

  <!-- VISTA CONTROLADOR -->
  <div id="controller-container">
    <div class="p-control">
      <h2 style="color: #ef4444; margin: 0;">JUGADOR 1</h2>
      <div class="btn-group">
        <button class="btn-p1" onclick="changeScore(1, -1)">-</button>
        <button class="btn-p1" onclick="changeScore(1, 1)">+</button>
      </div>
      <div id="disp-p1" class="score-disp">0</div>
    </div>

    <hr style="width: 80%; border-color: #334155;">

    <div class="p-control">
      <h2 style="color: #3b82f6; margin: 0;">JUGADOR 2</h2>
      <div class="btn-group">
        <button class="btn-p2" onclick="changeScore(2, -1)">-</button>
        <button class="btn-p2" onclick="changeScore(2, 1)">+</button>
      </div>
      <div id="disp-p2" class="score-disp">0</div>
    </div>
  </div>

  <script>
    // ESTADO
    let p1Score = 0;
    let p2Score = 0;

    // DETECCIÓN DE RUTA PARA MODO CONTROLADOR (#controller)
    const isController = window.location.hash === '#controller';

    if (isController) {
      document.getElementById('overlay-container').style.display = 'none';
      document.getElementById('controller-container').style.display = 'flex';
      document.getElementById('status-bar').style.display = 'none';
    }

    // BROADCAST CHANNEL PARA SINCRONIZACIÓN
    const channel = new BroadcastChannel('game_track_channel');

    channel.onmessage = (event) => {
      const data = event.data;
      if (data.type === 'UPDATE_SCORES') {
        p1Score = data.p1;
        p2Score = data.p2;
        updateUI();
      }
    };

    function changeScore(player, delta) {
      if (player === 1) {
        p1Score = Math.min(Math.max(p1Score + delta, 0), 8);
      } else if (player === 2) {
        p2Score = Math.min(Math.max(p2Score + delta, 0), 8);
      }
      
      channel.postMessage({
        type: 'UPDATE_SCORES',
        p1: p1Score,
        p2: p2Score
      });

      updateUI();
    }

    function updateUI() {
      if (isController) {
        document.getElementById('disp-p1').textContent = p1Score;
        document.getElementById('disp-p2').textContent = p2Score;
      } else {
        moveTokenCentered('token-p1', 'p1-side', p1Score);
        moveTokenCentered('token-p2', 'p2-side', p2Score);
      }
    }

    // CÁLCULO Y CENTRADO DE FICHAS
    function moveTokenCentered(tokenId, containerId, value) {
      const token = document.getElementById(tokenId);
      const track = document.getElementById('track');
      let targetNode;

      // Definir dinámicamente el tamaño matemáticamente antes de calcular la posición
      const tokenW = (value === 8) ? 100 : 70;
      const tokenH = (value === 8) ? 100 : 70;

      if (value === 8) {
        targetNode = document.getElementById('goal-node');
        token.classList.add('is-goal');
      } else {
        const container = document.getElementById(containerId);
        targetNode = container.querySelector(`[data-val="${value}"]`);
        token.classList.remove('is-goal');
      }

      if (targetNode && track) {
        const trackRect = track.getBoundingClientRect();
        const nodeRect = targetNode.getBoundingClientRect();

        const trackStyle = window.getComputedStyle(track);
        const borderLeft = parseFloat(trackStyle.borderLeftWidth) || 0;
        const borderTop = parseFloat(trackStyle.borderTopWidth) || 0;

        const nodeCenterX = nodeRect.left + (nodeRect.width / 2);
        const nodeCenterY = nodeRect.top + (nodeRect.height / 2);

        const exactX = nodeCenterX - trackRect.left - borderLeft - (tokenW / 2);
        const exactY = nodeCenterY - trackRect.top - borderTop - (tokenH / 2);

        token.style.transform = `translate3d(${exactX}px, ${exactY}px, 0)`;
      }
    }

    // EVENTO DE VISIBILIDAD PARA OBS STUDIO
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        const track = document.getElementById('track');
        
        if (track) {
          track.classList.remove('animate-in');
          void track.offsetWidth; // Forzar reflow en CSS
          track.classList.add('animate-in');
        }

        // Re-centra las fichas exactas al finalizar la animación
        setTimeout(() => {
          updateUI();
        }, 600);
      }
    });

    // INICIALIZACIÓN
    window.addEventListener('load', () => {
      const statusBar = document.getElementById('status-bar');
      if (statusBar) statusBar.textContent = 'Listo';
      updateUI();
    });

    window.addEventListener('resize', () => {
      if (!isController) updateUI();
    });
  </script>
</body>
</html>
